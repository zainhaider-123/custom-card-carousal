<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style.css">
  <title>Document</title>
</head>

<body>

  <div class="my-carousel">
    <div class="my-carousel__content">
      <h1 class="my-carousel__title">THIS IS YOUR COMMUNITY</h1>
      <p class="my-carousel__subtitle">Share your #BeautyMarks and Tag @LuminaBeauty for a Chance to be Featured.</p>
      <div class="my-carousel__buttons">
        <button class="btn btn--primary">LEARN MORE</button>
        <button class="btn btn--play" aria-label="Play video">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="my-carousel__track">
      <div class="my-carousel__slides">
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--1">
            <div>Slide 1</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--2">
            <div>Slide 2</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--3">
            <div>Slide 3</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--4">
            <div>Slide 4</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--5">
            <div>Slide 5</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--6">
            <div>Slide 6</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--7">
            <div>Slide 7</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--8">
            <div>Slide 8</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--9">
            <div>Slide 9</div>
          </div>
        </div>
        <div class="my-carousel__slide">
          <div class="swiper-card swiper-card--10">
            <div>Slide 10</div>
          </div>
        </div>
      </div>
    </div>

    <div class="my-carousel__actions">
      <button class="my-carousel__control my-carousel__control--prev" aria-label="Previous slide">Prev</button>
      <button class="my-carousel__control my-carousel__control--next" aria-label="Next slide">Next</button>
    </div>
  </div>


  <script src="./src/main.js"></script>
</body>

</html>
