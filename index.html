<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/style.css">
  <title>Document</title>
</head>

<body>


  <div class="my-carousel__track">
    <div class="my-carousel__slides">
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--1">
          <div>Slide 1</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--2">
          <div>Slide 2</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--3">
          <div>Slide 3</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--4">
          <div>Slide 4</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--5">
          <div>Slide 5</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--6">
          <div>Slide 6</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--7">
          <div>Slide 7</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--8">
          <div>Slide 8</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--9">
          <div>Slide 9</div>
        </div>
      </div>
      <div class="my-carousel__slide">
        <div class="swiper-card swiper-card--10">
          <div>Slide 10</div>
        </div>
      </div>
    </div>
  </div>

  <div class="my-carousel__actions">
    <button class="my-carousel__control my-carousel__control--prev" aria-label="Previous slide">Prev</button>
    <button class="my-carousel__control my-carousel__control--next" aria-label="Next slide">Next</button>
  </div>
  </div>


  <script src="./src/main.js"></script>
</body>

</html>
